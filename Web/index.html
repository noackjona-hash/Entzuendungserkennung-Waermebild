<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jugend Forscht 2026 - Thermografie Analyse</title>
    <!-- Tailwind CSS für professionelles Design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; }
        canvas { cursor: crosshair; }
        .loader { border-top-color: #3498db; -webkit-animation: spinner 1.5s linear infinite; animation: spinner 1.5s linear infinite; }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-screen flex flex-col text-gray-800">

    <!-- Header -->
    <header class="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center">
        <div>
            <h1 class="text-2xl font-bold">Thermografie Analyse API</h1>
            <p class="text-sm text-blue-200">Jugend Forscht 2026 - Jona Noack</p>
        </div>
        <div class="flex items-center gap-4">
            <span id="apiStatus" class="flex items-center text-sm font-semibold text-green-400">
                <span class="w-3 h-3 rounded-full bg-green-400 mr-2 animate-pulse"></span>
                API Ready (Online)
            </span>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 flex overflow-hidden">
        
        <!-- Linke Sidebar: Controls & Segmente -->
        <aside class="w-1/3 bg-white border-r border-gray-200 shadow-sm flex flex-col p-6 overflow-y-auto">
            <h2 class="text-lg font-bold mb-4 border-b pb-2">1. Bild hochladen</h2>
            <input type="file" id="imageInput" accept="image/png, image/jpeg" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-6"/>

            <h2 class="text-lg font-bold mb-2 border-b pb-2">2. Segmente (Zehen/Finger)</h2>
            <p class="text-sm text-gray-600 mb-4" id="instructionText">Lade zuerst ein Bild hoch.</p>
            
            <ul id="segmentList" class="mb-4 space-y-2 text-sm text-gray-700">
                <!-- Segmente tauchen hier auf -->
            </ul>

            <button id="resetSegmentsBtn" class="w-full bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded transition hidden mb-6">
                Markierungen löschen
            </button>

            <h2 class="text-lg font-bold mb-4 border-b pb-2">3. KI Analyse</h2>
            <button id="analyzeBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded shadow-lg transition disabled:bg-gray-400 disabled:cursor-not-allowed" disabled>
                Analyse Starten
            </button>

            <!-- Lade-Animation -->
            <div id="loadingIndicator" class="hidden mt-6 flex flex-col items-center">
                <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-10 w-10 mb-2"></div>
                <p class="text-sm text-gray-600 font-semibold text-center">Analysiere Wärmebild...<br>(max. 30 Sekunden)</p>
            </div>

            <!-- Ergebnisse -->
            <div id="resultsArea" class="hidden mt-6">
                <h3 class="text-md font-bold text-red-600 border-b pb-2 mb-2">Befund:</h3>
                <p id="resultSummary" class="text-sm font-semibold mb-3"></p>
                <div id="resultDetails" class="space-y-3">
                    <!-- Detail-Karten kommen hier rein -->
                </div>
            </div>
        </aside>

        <!-- Rechte Seite: Canvas (Bild) -->
        <section class="w-2/3 bg-gray-900 flex justify-center items-center overflow-auto p-4 relative">
            <canvas id="mainCanvas" class="bg-black shadow-2xl rounded max-w-full max-h-full"></canvas>
            <p id="canvasPlaceholder" class="absolute text-gray-500 text-xl font-light">Bild wird hier angezeigt</p>
        </section>

    </main>

    <script>
        // --- Globale Variablen ---
        // WICHTIG: Hier ist jetzt deine Live-URL von Render eingetragen!
        const API_URL = "https://entzuendungserkennung-waermebild.onrender.com/analyze";
        
        const imageInput = document.getElementById('imageInput');
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const placeholder = document.getElementById('canvasPlaceholder');
        const instructionText = document.getElementById('instructionText');
        const segmentList = document.getElementById('segmentList');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resetSegmentsBtn = document.getElementById('resetSegmentsBtn');
        
        let originalImage = null;
        let imageFile = null;
        let segments = [];
        let currentStart = null;
        let scale = 1; // Skalierungsfaktor zwischen Originalbild und Canvas-Anzeige

        // --- Bild Laden & Zeichnen ---
        imageInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            
            imageFile = file;
            const reader = new FileReader();
            
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    originalImage = img;
                    placeholder.classList.add('hidden');
                    resetState();
                    drawCanvas();
                    instructionText.innerText = "Klicke auf den Canvas, um den START und ENDE eines Zehs zu markieren.";
                    analyzeBtn.disabled = true; // Erst markieren, dann analysieren
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function resetState() {
            segments = [];
            currentStart = null;
            updateSegmentUI();
            document.getElementById('resultsArea').classList.add('hidden');
        }

        resetSegmentsBtn.addEventListener('click', () => {
            resetState();
            drawCanvas();
            analyzeBtn.disabled = true;
        });

        function drawCanvas() {
            if (!originalImage) return;

            // Canvas an Container anpassen (Responsiv)
            const containerWidth = canvas.parentElement.clientWidth - 40;
            const containerHeight = canvas.parentElement.clientHeight - 40;
            
            const ratio = Math.min(containerWidth / originalImage.width, containerHeight / originalImage.height);
            scale = ratio; // WICHTIG: Speichern für Klick-Umrechnung!

            canvas.width = originalImage.width * ratio;
            canvas.height = originalImage.height * ratio;

            // Bild zeichnen
            ctx.drawImage(originalImage, 0, 0, canvas.width, canvas.height);

            // Bestehende Segmente zeichnen
            segments.forEach(seg => {
                const sx = seg.start[0] * scale;
                const sy = seg.start[1] * scale;
                const ex = seg.end[0] * scale;
                const ey = seg.end[1] * scale;

                ctx.beginPath();
                ctx.moveTo(sx, sy);
                ctx.lineTo(ex, ey);
                ctx.strokeStyle = '#00FFFF';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Punkte
                ctx.fillStyle = 'white';
                ctx.beginPath(); ctx.arc(sx, sy, 3, 0, 2*Math.PI); ctx.fill();
                ctx.beginPath(); ctx.arc(ex, ey, 3, 0, 2*Math.PI); ctx.fill();

                // Label
                ctx.fillStyle = '#00FFFF';
                ctx.font = '12px Arial';
                ctx.fillText(seg.name, ex + 10, ey);
            });

            // Aktuellen Startpunkt zeichnen (falls erster Klick gemacht wurde)
            if (currentStart) {
                const cx = currentStart[0] * scale;
                const cy = currentStart[1] * scale;
                ctx.fillStyle = 'yellow';
                ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 2*Math.PI); ctx.fill();
                ctx.strokeStyle = 'yellow';
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        // --- Canvas Interaktion ---
        canvas.addEventListener('mousedown', (e) => {
            if (!originalImage) return;

            // Mausposition relativ zum Canvas
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            // Umrechnen auf Originalbild-Koordinaten
            const originalX = Math.round(mouseX / scale);
            const originalY = Math.round(mouseY / scale);

            if (!currentStart) {
                // Erster Klick -> Startpunkt
                currentStart = [originalX, originalY];
                instructionText.innerText = "Klicke jetzt auf das ENDE.";
            } else {
                // Zweiter Klick -> Endpunkt & Speichern
                const segName = `Zeh ${segments.length + 1}`;
                segments.push({
                    name: segName,
                    start: currentStart,
                    end: [originalX, originalY]
                });
                currentStart = null;
                instructionText.innerText = `Markiert (${segName}). Weiter markieren oder Analyse starten.`;
                updateSegmentUI();
                analyzeBtn.disabled = false;
            }
            drawCanvas();
        });

        function updateSegmentUI() {
            segmentList.innerHTML = '';
            segments.forEach(seg => {
                const li = document.createElement('li');
                li.className = "bg-blue-50 p-2 rounded border border-blue-100 font-mono";
                li.innerText = `✔️ ${seg.name}`;
                segmentList.appendChild(li);
            });

            if (segments.length > 0) {
                resetSegmentsBtn.classList.remove('hidden');
            } else {
                resetSegmentsBtn.classList.add('hidden');
            }
        }

        // --- API Anbindung ---
        analyzeBtn.addEventListener('click', async () => {
            if (!imageFile || segments.length === 0) return;

            // UI Zustand: Laden
            analyzeBtn.disabled = true;
            analyzeBtn.innerText = "Lädt...";
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('resultsArea').classList.add('hidden');

            // Formulardaten für die FastAPI vorbereiten
            const formData = new FormData();
            formData.append('file', imageFile);
            formData.append('segmente_json', JSON.stringify(segments));

            try {
                // WICHTIG: Anfrage an die Live-URL auf Render senden
                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Server Fehler: ${response.statusText}`);
                }

                const data = await response.json();
                zeigeErgebnisse(data);

            } catch (error) {
                alert("Fehler bei der API Kommunikation. Läuft die API auf Render?\n" + error);
            } finally {
                // UI Zustand: Wiederherstellen
                analyzeBtn.disabled = false;
                analyzeBtn.innerText = "Analyse Starten";
                document.getElementById('loadingIndicator').classList.add('hidden');
            }
        });

        function zeigeErgebnisse(data) {
            // 1. Ergebnisbild im Canvas anzeigen
            const resultImage = new Image();
            resultImage.onload = () => {
                originalImage = resultImage; // Überschreibe Originalbild mit gerendertem
                resetState(); // Lösche blaue Linien aus dem Frontend-Speicher
                drawCanvas();
            };
            // Base64 String direkt als Bildquelle nutzen!
            resultImage.src = "data:image/png;base64," + data.ergebnis_bild_base64;

            // 2. Daten im HTML anzeigen
            const resultsArea = document.getElementById('resultsArea');
            const summary = document.getElementById('resultSummary');
            const details = document.getElementById('resultDetails');
            
            resultsArea.classList.remove('hidden');
            details.innerHTML = '';

            if (data.gefundene_anomalien === 0) {
                summary.innerText = "Keine signifikanten Entzündungen detektiert.";
                summary.className = "text-sm font-semibold mb-3 text-green-600";
            } else {
                summary.innerText = `${data.gefundene_anomalien} Entzündung(en) detektiert!`;
                summary.className = "text-sm font-semibold mb-3 text-red-600";

                data.daten.forEach(entz => {
                    const card = document.createElement('div');
                    card.className = "bg-red-50 border-l-4 border-red-500 p-3 rounded shadow-sm text-sm";
                    card.innerHTML = `
                        <p class="font-bold text-red-700">${entz.gelenk}</p>
                        <p><strong>Konfidenz:</strong> ${entz.score_percent}%</p>
                        <p><strong>Max Temp:</strong> ${entz.temperatur_celsius.max} °C</p>
                        <p><strong>Fläche:</strong> ${entz.geometrie.flaeche_px} px²</p>
                    `;
                    details.appendChild(card);
                });
            }
            
            instructionText.innerText = "Analyse erfolgreich! Neues Bild laden zum Fortfahren.";
        }
    </script>
</body>
</html>
