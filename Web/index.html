<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoAI Vision v15 | Clinical Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js für professionelle Graphen -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { clinical: { dark: '#020617', panel: '#0f172a', accent: '#06b6d4' } } } } }
    </script>
    <style>
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        canvas#mainCanvas { image-rendering: pixelated; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 glass-panel p-6 rounded-2xl shadow-2xl border-t border-t-clinical-accent/30">
        <div>
            <h1 class="text-3xl font-bold tracking-tight text-white flex items-center gap-3">
                ThermoAI Vision <span class="bg-clinical-accent/20 text-clinical-accent px-2 py-0.5 rounded text-sm font-mono ring-1 ring-clinical-accent/50">v15 ENTERPRISE</span>
            </h1>
            <p class="text-sm text-slate-400 mt-1 font-mono">Lead Researcher: Jona Noack | Jugend Forscht 2026</p>
        </div>
        <div class="mt-4 md:mt-0 flex items-center gap-4">
            <div class="flex items-center gap-2 bg-emerald-500/10 border border-emerald-500/30 px-4 py-2 rounded-full">
                <span class="relative flex h-3 w-3"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span><span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span></span>
                <span class="text-xs font-mono text-emerald-400 font-bold">API CONNECTED</span>
            </div>
        </div>
    </header>

    <main class="flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Linke Spalte: Steuerung -->
        <div class="space-y-6">
            <!-- Upload Module -->
            <div class="glass-panel p-6 rounded-2xl shadow-lg">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2"><svg class="w-4 h-4 text-clinical-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg> 1. Akquise</h2>
                
                <label class="block mb-3">
                    <span class="text-xs text-slate-400 mb-1 block">Patienten ID (Für Verlauf)</span>
                    <input type="text" id="patientId" value="PATIENT-001" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-clinical-accent font-mono">
                </label>

                <input type="file" id="thermalInput" class="hidden" accept="image/png, image/jpeg">
                <button onclick="document.getElementById('thermalInput').click()" class="w-full py-3 mb-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-600 transition-colors text-sm font-medium flex items-center justify-center gap-2">
                    📸 Wärmebild laden
                </button>
                <p id="fileNameDisplay" class="text-[10px] text-center text-slate-500 font-mono break-all"></p>
            </div>

            <!-- Analyse Starten -->
            <button id="analyzeBtn" onclick="analyze()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 font-bold shadow-[0_0_20px_rgba(6,182,212,0.3)] transition-all flex items-center justify-center gap-2 disabled:opacity-50">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                DEEP SCAN INITIALISIEREN
            </button>

            <!-- Kurz-Protokoll -->
            <div class="glass-panel p-4 rounded-2xl h-48 overflow-y-auto font-mono text-[10px] space-y-1" id="logArea">
                <p class="text-slate-500">> SYSTEM READY.</p>
            </div>
        </div>

        <!-- Rechte Spalte: Viewport & Charts -->
        <div class="lg:col-span-2 flex flex-col gap-6">
            
            <!-- Bild & Overlay Canvas -->
            <div class="glass-panel rounded-2xl p-4 shadow-xl flex justify-center items-center relative overflow-hidden bg-[#050505] min-h-[400px]">
                <canvas id="mainCanvas" class="max-w-full max-h-[500px] object-contain z-10 relative"></canvas>
                
                <div id="loadingOverlay" class="absolute inset-0 bg-clinical-dark/80 backdrop-blur-sm z-20 hidden flex-col items-center justify-center">
                    <div class="w-16 h-16 border-4 border-clinical-accent border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="font-mono text-clinical-accent tracking-widest text-sm animate-pulse">BERECHNE TENSOR-GEOMETRIE...</p>
                </div>
                
                <div id="placeholderText" class="absolute text-slate-600 font-mono tracking-widest flex flex-col items-center">
                    <svg class="w-12 h-12 mb-2 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    NO SIGNAL
                </div>
            </div>

            <!-- Interaktiver Trend-Graph (Chart.js) -->
            <div class="glass-panel rounded-2xl p-6 shadow-xl">
                <h2 class="text-sm font-bold text-slate-300 uppercase mb-4 flex items-center justify-between">
                    Therapie-Verlauf (Trend-Analyse)
                    <span class="text-[10px] font-mono bg-blue-500/20 text-blue-400 px-2 py-1 rounded">LIVE CHART</span>
                </h2>
                <div class="h-64 w-full relative">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
            
        </div>
    </main>

    <script>
        const API_URL = "http://localhost:8000/analyze"; // Passe dies ggf. für Render.com an
        
        let loadedImage = null;
        let chartInstance = null;
        
        const canvas = document.getElementById('mainCanvas');
        const ctx = canvas.getContext('2d');
        const fileInput = document.getElementById('thermalInput');

        // Bildauswahl & Vorschau
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('fileNameDisplay').innerText = file.name;
            document.getElementById('placeholderText').style.display = 'none';
            
            const reader = new FileReader();
            reader.onload = (event) => {
                const img = new Image();
                img.onload = () => {
                    loadedImage = img;
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.clearRect(0,0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        function logMsg(msg, color="text-slate-400") {
            const el = document.getElementById('logArea');
            el.innerHTML += `<p class="${color}">> ${msg}</p>`;
            el.scrollTop = el.scrollHeight;
        }

        async function analyze() {
            if (!loadedImage) return alert("Bitte zuerst ein Wärmebild laden.");
            
            const file = fileInput.files[0];
            const pid = document.getElementById('patientId').value || "ANONYMOUS";
            
            const fd = new FormData();
            fd.append('file', file);
            fd.append('mode', 'auto');
            fd.append('patient_id', pid);

            document.getElementById('loadingOverlay').classList.remove('hidden');
            document.getElementById('analyzeBtn').disabled = true;

            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'X-API-Key': 'jf2026-jona-super-secret-key-9988' },
                    body: fd
                });
                
                if (!res.ok) throw new Error("API Fehler");
                const data = await res.json();
                
                // Overlay Zeichnen
                drawResults(data.daten);
                
                // Chart Update
                updateChart(data.history_trend);
                
                // Log
                document.getElementById('logArea').innerHTML = '';
                data.protokoll.forEach(l => logMsg(l, l.includes('ALARM') ? 'text-red-400 font-bold' : 'text-emerald-400'));
                
            } catch(e) {
                logMsg(`FEHLER: ${e.message}`, "text-red-500");
                alert("Fehler bei der Verbindung zur API.");
            } finally {
                document.getElementById('loadingOverlay').classList.add('hidden');
                document.getElementById('analyzeBtn').disabled = false;
            }
        }

        function drawResults(daten) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(loadedImage, 0, 0);
            
            daten.forEach(entz => {
                const box = entz.bbox;
                const isCrit = entz.severity === 'CRITICAL' || entz.symmetrie_alarm;
                const color = isCrit ? '#ef4444' : '#0ea5e9'; // Rot oder Cyan
                
                // Box
                ctx.strokeStyle = color;
                ctx.lineWidth = 2;
                ctx.strokeRect(box[0], box[1], box[2], box[3]);
                
                // Konturen malen
                if(entz.konturen.mid) {
                    ctx.beginPath();
                    ctx.moveTo(entz.konturen.mid[0][0], entz.konturen.mid[0][1]);
                    for(let i=1; i<entz.konturen.mid.length; i++) ctx.lineTo(entz.konturen.mid[i][0], entz.konturen.mid[i][1]);
                    ctx.closePath();
                    ctx.strokeStyle = 'rgba(255, 165, 0, 0.8)';
                    ctx.stroke();
                }

                // UI Label
                ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
                ctx.fillRect(box[0], Math.max(0, box[1] - 45), 180, 40);
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Inter';
                ctx.fillText(entz.gelenk, box[0] + 5, Math.max(0, box[1] - 30));
                
                ctx.fillStyle = color;
                ctx.font = '11px monospace';
                const alarmTxt = entz.symmetrie_alarm ? ` | SYMM WARN!` : '';
                ctx.fillText(`${entz.temp.max}°C | Conf: ${entz.score}%${alarmTxt}`, box[0] + 5, Math.max(0, box[1] - 12));
            });
        }

        function updateChart(history) {
            const ctxChart = document.getElementById('trendChart').getContext('2d');
            
            const labels = history.map(h => h.timestamp.split(' ')[0]); // Nur Datum
            const temps = history.map(h => h.max_temp);
            const anomalies = history.map(h => h.anomalien_count);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Höchste Temperatur (°C)',
                            data: temps,
                            borderColor: '#06b6d4',
                            backgroundColor: 'rgba(6, 182, 212, 0.1)',
                            borderWidth: 3,
                            tension: 0.4,
                            fill: true,
                            yAxisID: 'y'
                        },
                        {
                            label: 'Anzahl Befunde',
                            data: anomalies,
                            borderColor: '#ef4444',
                            borderWidth: 2,
                            borderDash: [5, 5],
                            tension: 0.1,
                            yAxisID: 'y1'
                        }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#94a3b8', font: {family: 'monospace'} } },
                        y: { 
                            type: 'linear', display: true, position: 'left',
                            grid: { color: 'rgba(255,255,255,0.05)' },
                            ticks: { color: '#06b6d4', callback: function(val){return val+'°C';} },
                            suggestedMin: 30, suggestedMax: 42
                        },
                        y1: {
                            type: 'linear', display: true, position: 'right',
                            grid: { drawOnChartArea: false },
                            ticks: { color: '#ef4444', stepSize: 1 },
                            suggestedMin: 0, suggestedMax: 10
                        }
                    },
                    plugins: { legend: { labels: { color: '#f8fafc', font: {family: 'Inter'} } } }
                }
            });
        }
    </script>
</body>
</html>
