<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoAI Vision v16.0 | Clinical Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
        
        body { background-color: #020617; color: #f8fafc; font-family: 'Inter', sans-serif; overflow: hidden; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.08); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        
        .status-pulse { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
    </style>
</head>
<body class="h-screen flex flex-col p-4 gap-4">
    <header class="flex justify-between items-center glass-panel p-4 rounded-2xl shrink-0">
        <div class="flex items-center gap-4">
            <div class="bg-cyan-500/20 p-2 rounded-xl border border-cyan-500/30">
                <svg class="w-6 h-6 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">ThermoAI Vision <span class="text-cyan-400 text-sm font-mono ml-2">v16.0 PRO</span></h1>
                <p class="text-[10px] text-slate-500 font-mono italic">Klinische Diagnostik-Umgebung</p>
            </div>
        </div>
        <div id="statusIndicator" class="flex items-center gap-3 bg-slate-900/50 px-4 py-2 rounded-full border border-slate-800">
            <div id="statusDot" class="h-2.5 w-2.5 rounded-full bg-amber-500"></div>
            <span id="statusText" class="text-[10px] font-bold font-mono text-amber-500 uppercase tracking-widest">Server-Check...</span>
        </div>
    </header>

    <div class="flex-1 flex gap-4 overflow-hidden">
        <aside class="w-80 flex flex-col gap-4 shrink-0">
            <div class="glass-panel p-5 rounded-2xl flex flex-col gap-4">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Patienten-Daten</h2>
                <input type="text" id="patientId" value="PAT-001" class="w-full bg-slate-950/50 border border-slate-700 rounded-xl px-4 py-2 text-sm focus:border-cyan-500 outline-none font-mono">

                <div class="flex flex-col gap-2 mt-2">
                    <input type="file" id="imgInput" class="hidden" accept="image/*">
                    <button onclick="document.getElementById('imgInput').click()" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-semibold border border-slate-700">WÄRMEBILD LADEN</button>
                    <button id="analyzeBtn" onclick="analyze()" class="w-full py-4 mt-2 bg-cyan-600 hover:bg-cyan-500 text-white rounded-xl font-bold shadow-lg shadow-cyan-900/20 transition-all flex items-center justify-center gap-2">
                        <span>ANALYSE STARTEN</span>
                    </button>
                </div>
            </div>

            <div class="glass-panel flex-1 rounded-2xl p-4 overflow-hidden flex flex-col">
                <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-3">System-Log</h2>
                <div id="logArea" class="flex-1 overflow-y-auto font-mono text-[10px] space-y-1 pr-2 custom-scrollbar text-slate-400">
                    <p>> Konsole v16.0 bereit.</p>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col gap-4 overflow-hidden">
            <div class="flex-1 flex gap-4 overflow-hidden">
                <div class="flex-1 glass-panel rounded-2xl relative overflow-hidden bg-black/20 flex items-center justify-center">
                    <canvas id="mainCanvas" class="max-w-full max-h-full object-contain z-10"></canvas>
                    <div id="loader" class="absolute inset-0 bg-slate-950/90 z-20 flex flex-col items-center justify-center hidden">
                        <div class="w-16 h-16 border-2 border-cyan-500 border-t-transparent rounded-full animate-spin mb-4 shadow-[0_0_20px_rgba(6,182,212,0.3)]"></div>
                        <p id="loaderText" class="text-[11px] font-mono text-cyan-500 tracking-[0.3em] uppercase animate-pulse">Analysiere Bilddaten...</p>
                    </div>
                </div>

                <div class="w-72 glass-panel rounded-2xl p-4 flex flex-col gap-4 overflow-hidden">
                    <h2 class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em]">Befund-Liste</h2>
                    <div id="findingsList" class="flex-1 overflow-y-auto space-y-2 custom-scrollbar pr-1"></div>
                </div>
            </div>

            <div class="h-64 glass-panel rounded-2xl p-5 flex flex-col gap-2">
                <div class="flex-1 relative">
                    <canvas id="trendChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://entzuendungserkennung-waermebild.onrender.com"; // Ggf. für lokal anpassen!
        const API_KEY = "jf2026-jona-super-secret-key-9988";
        
        let loadedImg = null, chart = null, currentFindings = [];
        let serverReady = false;
        const canvas = document.getElementById('mainCanvas'), ctx = canvas.getContext('2d');

        async function checkServerStatus() {
            try {
                const res = await fetch(`${API_BASE}/health`);
                if(res.ok) {
                    serverReady = true;
                    updateStatus('Online', 'bg-emerald-500', 'text-emerald-500');
                    return true;
                }
            } catch(e) {
                serverReady = false;
                updateStatus('Cloud-Boot...', 'bg-amber-500', 'text-amber-500');
            }
            return false;
        }

        setInterval(() => { if(!serverReady) checkServerStatus(); }, 5000);
        checkServerStatus();

        document.getElementById('imgInput').onchange = (e) => {
            const file = e.target.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image();
                img.onload = () => { 
                    loadedImg = img; 
                    canvas.width = img.width; canvas.height = img.height; 
                    renderCanvas(); 
                    logMsg(`Bild geladen: ${file.name}`); 
                };
                img.src = ev.target.result;
            };
            reader.readAsDataURL(file);
        };

        function logMsg(m, c="text-slate-400") {
            const l = document.getElementById('logArea');
            const p = document.createElement('p');
            p.className = c; p.innerText = `> ${m}`;
            l.appendChild(p); l.scrollTop = l.scrollHeight;
        }

        function updateStatus(t, c_dot, c_txt) {
            const dot = document.getElementById('statusDot'), txt = document.getElementById('statusText');
            dot.className = `h-2.5 w-2.5 rounded-full ${c_dot} ${t === 'Online' ? 'status-pulse' : ''}`;
            txt.className = `text-[10px] font-bold font-mono ${c_txt} uppercase tracking-widest`;
            txt.innerText = t;
        }

        async function fetchWithRetry(url, options, retries = 6, backoff = 4000) {
            try {
                const res = await fetch(url, options);
                if (!res.ok) {
                    if (res.status === 422 || res.status === 400 || res.status === 403) {
                        const errData = await res.json();
                        const customError = new Error(errData.detail || `Fehler ${res.status}`);
                        customError.isClientError = true;
                        throw customError;
                    }
                    throw new Error(`Server Error Status ${res.status}`);
                }
                return await res.json();
            } catch (err) {
                if (retries > 0 && !err.isClientError) {
                    const nextBackoff = backoff * 1.3;
                    logMsg(`Server rechnet... Re-Sync in ${Math.round(backoff/1000)}s`);
                    await new Promise(r => setTimeout(r, backoff));
                    return fetchWithRetry(url, options, retries - 1, nextBackoff);
                }
                throw err;
            }
        }

        async function analyze() {
            if(!loadedImg) return alert("Bild laden!");
            const btn = document.getElementById('analyzeBtn'), loader = document.getElementById('loader');
            
            btn.disabled = true; loader.classList.remove('hidden');
            
            const fd = new FormData();
            fd.append('file', document.getElementById('imgInput').files[0]);
            fd.append('patient_id', document.getElementById('patientId').value);

            try {
                const data = await fetchWithRetry(`${API_BASE}/analyze`, {
                    method: 'POST',
                    headers: { 'X-API-Key': API_KEY },
                    body: fd
                });
                
                serverReady = true;
                currentFindings = data.daten;
                renderCanvas();
                updateFindingsList(data.daten);
                updateChart(data.history_trend);
                
                logMsg('Neue Analyse erfolgreich gesichert.', 'text-emerald-400');
                if(data.protokoll) data.protokoll.forEach(p => logMsg(p, p.includes('⚠️') ? 'text-amber-400' : 'text-cyan-400'));
                updateStatus('Online', 'bg-emerald-500', 'text-emerald-500');
            } catch(e) {
                if (e.isClientError) {
                    logMsg(`ANALYSE ABGEBROCHEN: ${e.message}`, "text-amber-400 font-bold");
                    alert(e.message);
                } else {
                    logMsg(`FEHLER: Server antwortet nicht.`, "text-red-500 font-bold");
                    alert("Der Server antwortet nicht rechtzeitig.");
                }
            } finally { 
                btn.disabled = false; loader.classList.add('hidden'); 
            }
        }

        function renderCanvas() {
            if(!loadedImg) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(loadedImg, 0, 0);
            currentFindings.forEach(d => {
                const b = d.bbox, color = (d.severity === 'CRITICAL' || d.symmetrie_alarm) ? '#ef4444' : '#06b6d4';
                ctx.strokeStyle = color; ctx.lineWidth = 4; ctx.strokeRect(b[0], b[1], b[2], b[3]);
                ctx.fillStyle = color; ctx.beginPath(); ctx.arc(d.zentrum.x, d.zentrum.y, 6, 0, Math.PI*2); ctx.fill();
            });
        }

        function updateFindingsList(daten) {
            const list = document.getElementById('findingsList');
            list.innerHTML = daten.map(d => `
                <div class="p-3 rounded-xl border ${d.symmetrie_alarm ? 'border-red-500/50 bg-red-500/10' : 'border-slate-800 bg-slate-900/40'}">
                    <div class="flex justify-between text-[11px] font-bold"><span>${d.gelenk}</span><span class="${d.symmetrie_alarm ? 'text-red-400' : 'text-cyan-400'}">${d.temp.max}°C</span></div>
                    <div class="text-[9px] text-slate-500 uppercase mt-1">Status: ${d.severity}</div>
                </div>
            `).join('');
            if(!daten.length) list.innerHTML = '<div class="text-[10px] text-slate-500 text-center py-4 italic">Keine Anomalien.</div>';
        }

        function updateChart(history) {
            if(!history) return;
            const ctxChart = document.getElementById('trendChart').getContext('2d');
            const h = history.slice(-10);
            if(chart) chart.destroy();
            chart = new Chart(ctxChart, {
                type: 'line',
                data: {
                    labels: h.map(x => x.timestamp.split(' ')[0]),
                    datasets: [{ 
                        label: 'Max Temp', 
                        data: h.map(x => x.max_temp), 
                        borderColor: '#06b6d4', 
                        backgroundColor: 'rgba(6, 182, 212, 0.1)',
                        fill: true,
                        tension: 0.4 
                    }]
                },
                options: { 
                    responsive: true, maintainAspectRatio: false, 
                    scales: { 
                        y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } },
                        x: { grid: { display: false }, ticks: { color: '#64748b' } }
                    },
                    plugins: { legend: { display: false } } 
                }
            });
        }
    </script>
</body>
</html>
