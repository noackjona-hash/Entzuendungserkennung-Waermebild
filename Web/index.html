<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThermoAI Cloud - Jona Noack</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: radial-gradient(circle at top, #0f172a, #020617); color: white; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body class="p-8">
    <header class="max-w-6xl mx-auto flex justify-between items-center mb-12">
        <div>
            <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">ThermoAI Vision v14</h1>
            <p class="text-slate-400 font-mono text-sm">Clinical Diagnostic Suite | JF 2026</p>
        </div>
        <div class="px-4 py-2 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400 text-xs font-mono">
            ● SERVER ONLINE
        </div>
    </header>

    <main class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- Sidebar Controls -->
        <div class="space-y-6">
            <div class="glass p-6 rounded-2xl">
                <h2 class="text-sm font-bold uppercase tracking-widest text-cyan-400 mb-4">Upload Center</h2>
                <input type="file" id="thermalInput" class="hidden" accept="image/*">
                <button onclick="document.getElementById('thermalInput').click()" class="w-full py-3 mb-3 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 transition-all text-sm font-medium">📸 Thermal Image</button>
                
                <input type="file" id="rgbInput" class="hidden" accept="image/*">
                <button onclick="document.getElementById('rgbInput').click()" class="w-full py-3 rounded-xl bg-slate-800/50 border border-dashed border-slate-700 text-slate-400 text-xs">📷 Optional RGB Overlay</button>
            </div>

            <button onclick="analyze()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-600 font-bold shadow-lg shadow-cyan-900/20 hover:scale-[1.02] transition-transform">
                START DEEP ANALYSIS
            </button>
        </div>

        <!-- Main Viewport -->
        <div class="md:col-span-2 space-y-6">
            <div class="glass rounded-2xl aspect-video overflow-hidden relative group">
                <canvas id="mainCanvas" class="w-full h-full object-contain"></canvas>
                <div id="loader" class="absolute inset-0 bg-black/60 flex items-center justify-center hidden">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-cyan-500 border-t-transparent"></div>
                </div>
            </div>

            <!-- Trend Analysis View -->
            <div class="glass p-6 rounded-2xl">
                <h3 class="text-xs font-bold text-slate-500 uppercase mb-4">Therapie-Trend (History)</h3>
                <div id="trendLog" class="space-y-2 text-sm font-mono text-slate-300">
                    <p class="text-slate-500 italic">Keine Verlaufsdaten für dieses Bild gefunden.</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function analyze() {
            const thermal = document.getElementById('thermalInput').files[0];
            const rgb = document.getElementById('rgbInput').files[0];
            if(!thermal) return alert("Bitte Wärmebild laden!");

            const fd = new FormData();
            fd.append('file', thermal);
            if(rgb) fd.append('rgb_file', rgb);
            fd.append('mode', 'auto');

            document.getElementById('loader').classList.remove('hidden');

            try {
                const res = await fetch('http://localhost:8000/analyze', {
                    method: 'POST',
                    headers: { 'X-API-Key': 'jf2026-jona-super-secret-key-9988' },
                    body: fd
                });
                const data = await res.json();
                renderResults(data);
            } catch (e) {
                alert("Verbindungsfehler zur API!");
            } finally {
                document.getElementById('loader').classList.add('hidden');
            }
        }

        function renderResults(data) {
            // Trend Log updaten
            const log = document.getElementById('trendLog');
            log.innerHTML = data.history_trend.length > 0 
                ? data.history_trend.map(s => `<div>[${s.timestamp.split('T')[0]}] Befunde: ${s.anomalien_count} | Max: ${s.max_temp}°C</div>`).join('')
                : '<p class="text-emerald-500">Erster Scan für diesen Patienten gespeichert.</p>';
            
            // Canvas Overlay Logik hier...
        }
    </script>
</body>
</html>
